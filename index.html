<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Lamp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Beautiful Table Lamp</h1>
        
        <!-- Lamp -->
        <div class="lamp" id="lamp">
            <!-- Lamp Shade -->
            <div class="lamp-shade">
                <div class="shade-top"></div>
                <div class="shade-middle"></div>
                <div class="shade-bottom"></div>
            </div>
            
            <!-- Lamp Neck -->
            <div class="lamp-neck">
                <div class="neck-piece"></div>
                <div class="neck-piece"></div>
                <div class="neck-piece"></div>
            </div>
            
            <!-- Lamp Base -->
            <div class="lamp-base">
                <div class="base-top"></div>
                <div class="base-middle"></div>
                <div class="base-bottom"></div>
            </div>
            
            <!-- Light Bulb inside -->
            <div class="inner-bulb">
                <div class="bulb-filament"></div>
            </div>
            
            <!-- Switch -->
            <div class="lamp-switch" id="lampSwitch">
                <div class="switch-knob"></div>
            </div>
        </div>
        
        <!-- Table -->
        <div class="table">
            <div class="table-top"></div>
            <div class="table-leg"></div>
            <div class="table-leg"></div>
        </div>
        
        <!-- Control Panel -->
        <div class="control-panel">
            <button class="toggle-btn" id="toggleBtn">
                <span class="btn-text">Lamp ON</span>
                <span class="btn-icon">💡</span>
            </button>
            <div class="instructions">
                <p>Button click karein ya lamp switch ko drag karein</p>
                <p>Spacebar bhi kaam karegi</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
